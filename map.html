<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CIVICFIX AI | Complaint Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f3ff;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            padding: 22px 30px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 6px;
        }

        header p {
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .info-card {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .info-card strong {
            color: #6a11cb;
            font-size: 22px;
        }

        .btn {
            text-decoration: none;
            background: #6a11cb;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
        }

        .btn:hover {
            opacity: 0.9;
        }

        #map {
            height: 600px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            border: 3px solid white;
        }

        .legend {
            background: white;
            margin-top: 20px;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .legend h3 {
            margin-bottom: 12px;
            color: #6a11cb;
        }

        .legend-item {
            display: inline-block;
            margin-right: 25px;
            margin-bottom: 8px;
        }

        footer {
            margin-top: 30px;
            background: #17132b;
            color: white;
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 700px) {
            #map {
                height: 450px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🗺️ CIVICFIX AI</h1>
    <p>Smart Civic Complaint Map</p>
</header>

<div class="container">

    <div class="top-bar">

        <div class="info-card">
            📍 Total Complaints:
            <strong id="complaintCount">0</strong>
        </div>

        <a href="admin.html" class="btn">
            ← Back to Authority Dashboard
        </a>

    </div>

    <div id="map"></div>

    <div class="legend">

        <h3>Complaint Information</h3>

        <div class="legend-item">
            📌 Each marker represents a civic complaint
        </div>

        <div class="legend-item">
            Click a marker to view complaint details
        </div>

    </div>

</div>

<footer>
    <p>© 2026 CIVICFIX AI | CivicNova</p>
</footer>


<!-- Leaflet JS -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

    // ==========================================
    // CREATE MAP
    // ==========================================

    const map = L.map("map").setView(
        [20.0059, 73.7897],
        11
    );


    // ==========================================
    // OPEN STREET MAP
    // ==========================================

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    // ==========================================
    // LOAD COMPLAINTS
    // ==========================================

    fetch("get_complaints.php")

        .then(response => response.json())

        .then(complaints => {

            document.getElementById(
                "complaintCount"
            ).textContent = complaints.length;


            // ==========================================
            // ADD COMPLAINT MARKERS
            // ==========================================

            complaints.forEach(complaint => {

                /*
                    At this stage, locations are stored
                    as text in MySQL.

                    We use known city/location names
                    and convert them to map coordinates.
                */

                const coordinates =
                    getCoordinates(
                        complaint.location
                    );


                if (!coordinates) {
                    return;
                }


                const marker =
                    L.marker(coordinates)
                    .addTo(map);


                marker.bindPopup(`

                    <div style="min-width:220px;">

                        <h3 style="color:#6a11cb;">
                            ${escapeHTML(
                                complaint.complaint_id
                            )}
                        </h3>

                        <p>
                            <strong>Issue:</strong>
                            ${escapeHTML(
                                complaint.issue_title
                            )}
                        </p>

                        <p>
                            <strong>Category:</strong>
                            ${escapeHTML(
                                complaint.category
                            )}
                        </p>

                        <p>
                            <strong>Location:</strong>
                            ${escapeHTML(
                                complaint.location
                            )}
                        </p>

                        <p>
                            <strong>Priority:</strong>
                            ${escapeHTML(
                                complaint.priority
                            )}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            ${escapeHTML(
                                complaint.status
                            )}
                        </p>

                    </div>

                `);

            });

        })

        .catch(error => {

            console.error(
                "Complaint loading error:",
                error
            );

        });


    // ==========================================
    // LOCATION → COORDINATES
    // ==========================================

    function getCoordinates(location) {

        if (!location) {
            return null;
        }

        const text =
            location.toLowerCase().trim();


        // Nashik

        if (text.includes("nashik")) {

            return [
                20.0059,
                73.7897
            ];

        }


        // Satana

        if (text.includes("satana")) {

            return [
                20.5944,
                74.2040
            ];

        }


        // Ambad Nashik

        if (
            text.includes("ambad")
        ) {

            return [
                19.9470,
                73.7650
            ];

        }


        // Malegaon

        if (
            text.includes("malegaon")
        ) {

            return [
                20.5579,
                74.5089
            ];

        }


        return null;

    }


    // ==========================================
    // SECURITY
    // ==========================================

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

</script>

</body>
</html>
